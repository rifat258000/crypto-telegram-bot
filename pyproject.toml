[project]
name = "crypto-telegram-bot"
version = "1.0.0"
description = "Telegram bot for crypto market data — DEX & CEX tokens, live prices, charts, and more"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
